<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangar</title>
    <style>
      :root { --bg: #101214; --panel: #181b1e; --line: #2c3135; --text: #c4c5bb; --dim: #7f837c; --accent: #a8905c; --good: #6f8560; --warn: #a8603f; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 'Courier New', monospace; }
      body { display: flex; flex-direction: column; }
      button, select { font: inherit; color: var(--text); background: #22262a; border: 1px solid var(--line); border-radius: 2px; padding: 3px 9px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #111; }
      header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header .grow { flex: 1; }
      #work { flex: 1; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 0; }
      #hv { width: 820px; max-width: 100%; flex: 1; min-height: 0; background: #14171a; border: 2px solid #4a4a36; box-shadow: 6px 6px 0 #000; padding: 12px 16px; }
      #out { background: #0c0e10; border: 1px solid var(--line); padding: 6px; color: var(--dim); white-space: pre-wrap; word-break: break-all; width: 820px; max-width: 100%; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Hangar</strong>
      <span class="grow"></span>
      <span id="status" class="dim"></span>
    </header>
    <div id="work">
      <div id="hv"></div>
      <div id="out"></div>
    </div>
    <script type="module" src="src/ui/hangar.js"></script>
  </body>
</html>
