<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flak &amp; Fury</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f12;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      #wrap {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
      }
      #screen {
        cursor: none; /* the mouse is for looking around, not pointing */
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: #f2ead2;
        background: rgba(12, 15, 18, 0.72);
        text-align: center;
        user-select: none;
      }
      .screen h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        letter-spacing: 0.12em;
        color: #e8c860;
        text-shadow: 4px 4px 0 #3a2a10;
      }
      .screen p {
        margin: 0;
        font-size: clamp(0.8rem, 1.6vw, 1.1rem);
        opacity: 0.85;
      }
      /* The title menu: single player, host or join an online game. */
      .screen .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.8rem;
      }
      .screen .menu.hidden {
        display: none;
      }
      .screen .row {
        display: flex;
        gap: 0.6rem;
      }
      .screen button {
        min-width: 16rem;
        padding: 0.55rem 1.2rem;
        background: #1c201a;
        border: 2px solid #4a4a36;
        color: #d8d0b0;
        font: bold clamp(0.8rem, 1.5vw, 1rem) 'Courier New', monospace;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      .screen .row button {
        min-width: 0;
      }
      .screen button:hover:not(:disabled) {
        background: #2a2e22;
        border-color: #8a7a48;
        color: #f2ead2;
      }
      .screen button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .screen button.go {
        border-color: #e8c860;
        color: #e8c860;
      }
      .screen button.go:not(:disabled) {
        animation: pulse 1.4s ease-in-out infinite;
      }
      .screen button.toggle.on {
        background: #3a3420;
        border-color: #8a7a48;
        color: #f2ead2;
      }
      .screen button.back {
        min-width: 0;
        border-color: transparent;
        background: none;
        opacity: 0.7;
      }
      .screen .code {
        font: bold clamp(2rem, 5vw, 3.2rem) 'Courier New', monospace;
        letter-spacing: 0.4em;
        padding-left: 0.4em; /* balances the letter spacing after the last letter */
        color: #e8c860;
        text-shadow: 3px 3px 0 #3a2a10;
      }
      .screen input.code {
        width: 6.5em;
        background: #14171a;
        border: 2px solid #4a4a36;
        text-align: center;
        text-transform: uppercase;
        outline: none;
      }
      .screen input.code:focus {
        border-color: #8a7a48;
      }
      .screen .status {
        min-height: 1.3em;
        max-width: 34rem;
        color: #c8c0a0;
      }
      .screen .status.bad {
        color: #e08870;
      }
      .screen .fine {
        margin-top: 0.4rem;
        font-size: clamp(0.7rem, 1.2vw, 0.85rem);
        opacity: 0.55;
      }
      .screen.hidden {
        display: none;
      }
      .screen h2 {
        margin: 0;
        font-size: clamp(1.2rem, 3vw, 2rem);
        letter-spacing: 0.2em;
        color: #c8aa58;
        text-shadow: 3px 3px 0 #2a2010;
      }
      /* In-game pause and the options menu: darker, the game dim behind. */
      #pause,
      #options {
        background: rgba(8, 10, 12, 0.82);
        z-index: 5;
      }
      #options {
        justify-content: flex-start;
        padding: clamp(0.6rem, 3vh, 2rem) 1rem;
        box-sizing: border-box;
        gap: 0.7rem;
      }
      #options button {
        min-width: 0;
        padding: 0.35rem 0.7rem;
        font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      }
      #options .opt-tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.3rem;
      }
      #options .opt-tabs button.on {
        background: #3a3420;
        border-color: #8a7a48;
        color: #f2ead2;
      }
      #options .opt-body {
        width: min(44rem, 100%);
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        text-align: left;
        font-size: clamp(0.7rem, 1.3vw, 0.9rem);
        color: #c8c0a0;
        scrollbar-color: #4a4a36 #14171a;
      }
      #options .opt-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.35rem 0.4rem;
        border-bottom: 1px solid #23261e;
      }
      #options .opt-row.off {
        opacity: 0.4;
      }
      #options .choices {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.25rem;
      }
      #options .slider {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      #options .slider input {
        width: clamp(8rem, 18vw, 14rem);
        accent-color: #a08a4a;
      }
      #options .slider .value {
        min-width: 3.5em;
        text-align: right;
        color: #d8d0b0;
      }
      #options .keys {
        display: grid;
        grid-template-columns: 1fr 9rem 9rem;
        align-items: center;
        gap: 0.25rem 0.5rem;
        padding: 0 0.4rem;
      }
      #options .keys button.key.empty {
        opacity: 0.45;
      }
      #options .keys button.key.on {
        border-color: #e8c860;
        color: #e8c860;
        animation: pulse 1s ease-in-out infinite;
      }
      #options input.name {
        width: 12em;
        padding: 0.3rem 0.5rem;
        background: #14171a;
        border: 2px solid #4a4a36;
        color: #e8c860;
        font: bold 1rem 'Courier New', monospace;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        outline: none;
      }
      #options .fine {
        text-align: center;
        margin: 0.2rem 0 0.6rem;
      }
      #tuning {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(340px, 90vw);
        overflow-y: auto;
        padding: 10px 12px 20px;
        box-sizing: border-box;
        background: rgba(14, 18, 22, 0.92);
        border-left: 2px solid #3a4440;
        color: #e6e2d2;
        font: 12px/1.35 system-ui, sans-serif;
        z-index: 10;
      }
      #tuning.hidden {
        display: none;
      }
      #tuning .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      #tuning .head strong {
        font-size: 15px;
        color: #e8c860;
      }
      #tuning .head span,
      #tuning .foot,
      #tuning .info {
        opacity: 0.65;
        font-size: 11px;
      }
      #tuning .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #tuning button {
        background: #2c3632;
        color: #f0ead6;
        border: 1px solid #56625c;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
      }
      #tuning button:hover {
        background: #3c4844;
      }
      #tuning .status {
        min-height: 16px;
        margin: 6px 0;
        font-size: 11px;
      }
      #tuning .status.ok {
        color: #9ed88a;
      }
      #tuning .status.bad {
        color: #ff8a7a;
      }
      #tuning details {
        border-top: 1px solid #333c38;
        padding: 6px 0;
      }
      #tuning summary {
        cursor: pointer;
        font-weight: 600;
        color: #d8d0b0;
        margin-bottom: 4px;
      }
      #tuning .row {
        display: grid;
        grid-template-columns: 1fr 110px 64px;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      #tuning .row.check,
      #tuning .row.select {
        grid-template-columns: 1fr auto;
      }
      #tuning select {
        background: #1c2220;
        color: #f0ead6;
        border: 1px solid #46504c;
        font: inherit;
      }
      #tuning .row input[type='range'] {
        width: 100%;
        accent-color: #e8c860;
      }
      #tuning .row input[type='number'] {
        width: 100%;
        box-sizing: border-box;
        background: #1c2220;
        color: #f0ead6;
        border: 1px solid #46504c;
        font: inherit;
        padding: 1px 3px;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="screen"></canvas>
      <div id="start" class="screen">
        <h1>FLAK &amp; FURY</h1>
        <p id="controls-line"></p>
        <p>Use headphones for the full sound.</p>
        <div id="menu" class="menu">
          <button id="solo" class="go">SINGLE PLAYER</button>
          <button id="host">HOST ONLINE GAME</button>
          <button id="join">JOIN ONLINE GAME</button>
          <button id="title-options">OPTIONS</button>
        </div>
        <div id="host-menu" class="menu hidden">
          <p>ROOM CODE - GIVE IT TO YOUR FRIEND</p>
          <div id="room-code" class="code">····</div>
          <div class="row">
            <button id="side-same" class="toggle on">FRIEND ON MY SIDE</button>
            <button id="side-enemy" class="toggle">FRIEND AGAINST ME</button>
          </div>
          <p id="host-status" class="status"></p>
          <button id="host-start" class="go" disabled>START ENGINE</button>
          <button class="back">BACK</button>
        </div>
        <div id="join-menu" class="menu hidden">
          <p>ROOM CODE</p>
          <input id="join-code" class="code" maxlength="4" autocomplete="off" spellcheck="false" />
          <p id="join-status" class="status"></p>
          <button id="join-go" class="go" disabled>JOIN</button>
          <button class="back">BACK</button>
        </div>
        <p class="fine">YOU FLY THE <span id="plane-name"></span> - PICK ANOTHER IN THE TUNING PANEL (T)</p>
      </div>
      <!-- In-game menu: single player pauses; online an autopilot flies the plane meanwhile. -->
      <div id="pause" class="screen hidden">
        <h2 id="pause-title">PAUSED</h2>
        <p id="pause-note"></p>
        <div class="menu">
          <button id="resume" class="go">RESUME</button>
          <button id="pause-options">OPTIONS</button>
          <button id="quit">QUIT TO TITLE</button>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
