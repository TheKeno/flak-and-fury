<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flak &amp; Fury</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f12;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      #wrap {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
      }
      #screen {
        cursor: none; /* the mouse is for looking around, not pointing */
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #start {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: #f2ead2;
        background: rgba(12, 15, 18, 0.72);
        text-align: center;
        user-select: none;
      }
      #start h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        letter-spacing: 0.12em;
        color: #e8c860;
        text-shadow: 4px 4px 0 #3a2a10;
      }
      #start p {
        margin: 0;
        font-size: clamp(0.8rem, 1.6vw, 1.1rem);
        opacity: 0.85;
      }
      /* The title menu: single player, host or join an online game. */
      #start .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.8rem;
      }
      #start .menu.hidden {
        display: none;
      }
      #start .row {
        display: flex;
        gap: 0.6rem;
      }
      #start button {
        min-width: 16rem;
        padding: 0.55rem 1.2rem;
        background: #1c201a;
        border: 2px solid #4a4a36;
        color: #d8d0b0;
        font: bold clamp(0.8rem, 1.5vw, 1rem) 'Courier New', monospace;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      #start .row button {
        min-width: 0;
      }
      #start button:hover:not(:disabled) {
        background: #2a2e22;
        border-color: #8a7a48;
        color: #f2ead2;
      }
      #start button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #start button.go {
        border-color: #e8c860;
        color: #e8c860;
      }
      #start button.go:not(:disabled) {
        animation: pulse 1.4s ease-in-out infinite;
      }
      #start button.toggle.on {
        background: #3a3420;
        border-color: #8a7a48;
        color: #f2ead2;
      }
      #start button.back {
        min-width: 0;
        border-color: transparent;
        background: none;
        opacity: 0.7;
      }
      #start .code {
        font: bold clamp(2rem, 5vw, 3.2rem) 'Courier New', monospace;
        letter-spacing: 0.4em;
        padding-left: 0.4em; /* balances the letter spacing after the last letter */
        color: #e8c860;
        text-shadow: 3px 3px 0 #3a2a10;
      }
      #start input.code {
        width: 6.5em;
        background: #14171a;
        border: 2px solid #4a4a36;
        text-align: center;
        text-transform: uppercase;
        outline: none;
      }
      #start input.code:focus {
        border-color: #8a7a48;
      }
      #start .status {
        min-height: 1.3em;
        max-width: 34rem;
        color: #c8c0a0;
      }
      #start .status.bad {
        color: #e08870;
      }
      #start .fine {
        margin-top: 0.4rem;
        font-size: clamp(0.7rem, 1.2vw, 0.85rem);
        opacity: 0.55;
      }
      #start.hidden {
        display: none;
      }
      #tuning {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(340px, 90vw);
        overflow-y: auto;
        padding: 10px 12px 20px;
        box-sizing: border-box;
        background: rgba(14, 18, 22, 0.92);
        border-left: 2px solid #3a4440;
        color: #e6e2d2;
        font: 12px/1.35 system-ui, sans-serif;
        z-index: 10;
      }
      #tuning.hidden {
        display: none;
      }
      #tuning .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      #tuning .head strong {
        font-size: 15px;
        color: #e8c860;
      }
      #tuning .head span,
      #tuning .foot,
      #tuning .info {
        opacity: 0.65;
        font-size: 11px;
      }
      #tuning .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #tuning button {
        background: #2c3632;
        color: #f0ead6;
        border: 1px solid #56625c;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
      }
      #tuning button:hover {
        background: #3c4844;
      }
      #tuning .status {
        min-height: 16px;
        margin: 6px 0;
        font-size: 11px;
      }
      #tuning .status.ok {
        color: #9ed88a;
      }
      #tuning .status.bad {
        color: #ff8a7a;
      }
      #tuning details {
        border-top: 1px solid #333c38;
        padding: 6px 0;
      }
      #tuning summary {
        cursor: pointer;
        font-weight: 600;
        color: #d8d0b0;
        margin-bottom: 4px;
      }
      #tuning .row {
        display: grid;
        grid-template-columns: 1fr 110px 64px;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      #tuning .row.check,
      #tuning .row.select {
        grid-template-columns: 1fr auto;
      }
      #tuning select {
        background: #1c2220;
        color: #f0ead6;
        border: 1px solid #46504c;
        font: inherit;
      }
      #tuning .row input[type='range'] {
        width: 100%;
        accent-color: #e8c860;
      }
      #tuning .row input[type='number'] {
        width: 100%;
        box-sizing: border-box;
        background: #1c2220;
        color: #f0ead6;
        border: 1px solid #46504c;
        font: inherit;
        padding: 1px 3px;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="screen"></canvas>
      <div id="start">
        <h1>FLAK &amp; FURY</h1>
        <p>A/D: rotate &nbsp;·&nbsp; W/S: throttle &nbsp;·&nbsp; Left Shift: roll &nbsp;·&nbsp; Space: guns &nbsp;·&nbsp; E: bombs &nbsp;·&nbsp; G: gear &nbsp;·&nbsp; Arrows or right mouse: look</p>
        <p>Use headphones for the full sound.</p>
        <div id="menu" class="menu">
          <button id="solo" class="go">SINGLE PLAYER</button>
          <button id="host">HOST ONLINE GAME</button>
          <button id="join">JOIN ONLINE GAME</button>
        </div>
        <div id="host-menu" class="menu hidden">
          <p>ROOM CODE - GIVE IT TO YOUR FRIEND</p>
          <div id="room-code" class="code">····</div>
          <div class="row">
            <button id="side-same" class="toggle on">FRIEND ON MY SIDE</button>
            <button id="side-enemy" class="toggle">FRIEND AGAINST ME</button>
          </div>
          <p id="host-status" class="status"></p>
          <button id="host-start" class="go" disabled>START ENGINE</button>
          <button class="back">BACK</button>
        </div>
        <div id="join-menu" class="menu hidden">
          <p>ROOM CODE</p>
          <input id="join-code" class="code" maxlength="4" autocomplete="off" spellcheck="false" />
          <p id="join-status" class="status"></p>
          <button id="join-go" class="go" disabled>JOIN</button>
          <button class="back">BACK</button>
        </div>
        <p class="fine">YOU FLY THE <span id="plane-name"></span> - PICK ANOTHER IN THE TUNING PANEL (T)</p>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
